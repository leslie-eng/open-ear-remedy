# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy from repo root → New → Blueprint → connect GitHub repo.
# Database: Neon (not a Render database). Files: Cloudflare R2.

services:
  - type: web
    name: openear-api
    runtime: node
    # Starter, not free: free services sleep after 15 idle minutes, which drops every
    # listener's call connection. Calls need an always-on instance.
    plan: starter
    # npm workspaces: install from the repo root so @openear/shared is linked and built (root postinstall).
    buildCommand: npm ci
    preDeployCommand: npm run db:migrate -w @openear/api
    startCommand: npm start -w @openear/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://openearemedy.com
      - key: CORS_ORIGINS
        value: https://openearemedy.com,https://www.openearemedy.com
      - key: JWT_SECRET
        generateValue: true
      # Set to this service's URL (e.g. https://openear-api.onrender.com) so cover image links resolve.
      - key: PUBLIC_API_URL
        sync: false
      # Neon: pooled connection string for the app, direct one for migrations (sslmode=verify-full).
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Cloudflare TURN relay for calls (required: calls are refused without it in production)
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false
      # Cloudflare R2 (covers public bucket, ebooks private bucket)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BUCKET
        sync: false
      - key: R2_PRIVATE_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

  # Daily at 06:00 Nairobi (03:00 UTC): email Monthly Pass holders whose pass ends within 3 days.
  - type: cron
    name: openear-pass-reminders
    runtime: node
    plan: starter
    schedule: "0 3 * * *"
    buildCommand: npm ci
    startCommand: npm run jobs:pass-reminders -w @openear/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://openearemedy.com
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Open Ear <noreply@openearemedy.com>

