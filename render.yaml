# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy from repo root → New → Blueprint → connect GitHub repo.
# NOTE: the database section moves to Neon in the next stage.

services:
  - type: web
    name: openear-api
    runtime: node
    plan: free
    # npm workspaces: install from the repo root so @openear/shared is linked and built (root postinstall).
    buildCommand: npm ci
    preDeployCommand: npm run db:migrate -w @openear/api
    startCommand: npm start -w @openear/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://openearemedy.com
      - key: CORS_ORIGINS
        value: https://openearemedy.com,https://www.openearemedy.com
      - key: JWT_SECRET
        generateValue: true
      # Set to this service's URL (e.g. https://openear-api.onrender.com) so cover image links resolve.
      - key: PUBLIC_API_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: openear-db
          property: connectionString

databases:
  - name: openear-db
    plan: free
    databaseName: openear
    user: openear
