# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy from repo root → New → Blueprint → connect GitHub repo.

services:
  - type: web
    name: openear-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://openearemedy.com
      - key: CORS_ORIGINS
        value: https://openearemedy.com,https://www.openearemedy.com
      - key: JWT_SECRET
        generateValue: true
      # Set to this service's URL (e.g. https://openear-api.onrender.com) so cover image links resolve.
      - key: PUBLIC_API_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: openear-db
          property: connectionString

databases:
  - name: openear-db
    plan: free
    databaseName: openear
    user: openear
